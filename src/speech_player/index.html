<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; font: 14px system-ui, sans-serif; color: #18322d; }
.player { border: 1px solid #dbe4df; border-radius: 10px; padding: 12px; background: #f7faf8; }
button { border: 1px solid #9bb7ab; border-radius: 7px; padding: 7px 12px; background: white; color: #18322d; cursor: pointer; margin-right: 6px; }
button:disabled { opacity: .5; cursor: default; }
p { margin: 8px 0 0; font-size: 12px; line-height: 1.5; }
</style></head>
<body><div class="player">
<button id="play" hidden>Enable sound</button><button id="stop">Stop voice</button>
<p id="status" role="status">English audio starts automatically with your recording or file.</p>
<p id="model">AI-generated English voice</p>
</div><script src="player.js"></script></body></html>
