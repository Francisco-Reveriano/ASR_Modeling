[server]
# Keep live audio sessions stable; restart after Python/configuration changes.
fileWatcherType = "none"

[runner]
# Keep reruns sequential while callbacks hold recording state.
fastReruns = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#142f46"
backgroundColor = "#f5f7f9"
secondaryBackgroundColor = "#eff4f7"
textColor = "#142f46"
font = "sans serif"
